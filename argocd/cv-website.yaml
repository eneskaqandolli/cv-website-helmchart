apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cv-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eneskaqandolli/cv-website-helmchart.git
    targetRevision: main
    path: charts/cv-website
  destination:
    server: https://kubernetes.default.svc
    namespace: cv-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true